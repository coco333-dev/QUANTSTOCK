services:
  - type: web
    name: quantsmart-vn
    runtime: python
    plan: 0.5c-512mb
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_PATH
        value: /var/data/quantsmart.db
      - key: VNSTOCK_API_KEY
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: APP_PASSWORD
        sync: false
    disk:
      name: quantsmart-data
      mountPath: /var/data
      sizeGB: 1
